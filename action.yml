name: Skill Trigger Bench Lint
description: Lint Agent Skills with stb and report findings as GitHub annotations.
inputs:
  paths:
    description: Space-separated skill paths to lint.
    required: false
    default: .
  strict:
    description: Fail on warnings as well as errors.
    required: false
    default: "false"
  ignore:
    description: Comma-separated rule names to skip.
    required: false
    default: ""
  budget:
    description: Maximum combined description length in characters.
    required: false
    default: "15000"
  overlap:
    description: Similarity threshold for trigger-overlap warnings.
    required: false
    default: "0.35"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.10"
    - name: Install stb from this action
      shell: bash
      run: python -m pip install --disable-pip-version-check --no-deps "$GITHUB_ACTION_PATH"
    - name: Lint skills
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_BUDGET: ${{ inputs.budget }}
        INPUT_OVERLAP: ${{ inputs.overlap }}
      run: |
        python - <<'PY'
        import os
        import shlex
        import subprocess
        import sys

        command = ["stb", "lint", *shlex.split(os.environ["INPUT_PATHS"]), "--format", "github", "--no-plugins"]
        if os.environ["INPUT_STRICT"].lower() == "true":
            command.append("--strict")
        if os.environ["INPUT_IGNORE"]:
            command.extend(("--ignore", os.environ["INPUT_IGNORE"]))
        command.extend(("--budget", os.environ["INPUT_BUDGET"]))
        command.extend(("--overlap", os.environ["INPUT_OVERLAP"]))
        sys.exit(subprocess.run(command, check=False).returncode)
        PY
